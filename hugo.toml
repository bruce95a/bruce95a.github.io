baseURL = 'https://bruce95a.github.io/'
locale = 'en-us'
title = 'BSD Journey'
theme = 'PaperMod'

paginate = 5

# Minification Settings
[minify]
disableXML = true
minifyOutput = true

# --- Pagination Settings ---
[pagination]
disableAliases = false
pagerSize = 5

# --- Languages Configuration ---
[languages.en]
label = "English"
weight = 1
taxonomies = { category = "categories", tag = "tags", series = "series" }
menu = { main = [
    { name = "About", url = "about/", weight = 1 },
    { name = "Posts", url = "posts/", weight = 2 },
    { name = "Archive", url = "archives/", weight = 3 },
    { name = "Search", url = "search/", weight = 3 },
    { name = "Tags", url = "tags/", weight = 4 }
]}

[languages.zh]
label = "简体中文"
title = 'BSD之旅'
weight = 3
taxonomies = { category = "categories", tag = "tags", series = "series" }
menu = { main = [
    { name = "关于", url = "about/", weight = 1 },
    { name = "帖子", url = "posts/", weight = 2 },
    { name = "归档", url = "archives/", weight = 3 },
    { name = "搜索", url = "search/", weight = 3 },
    { name = "标签", url = "tags/", weight = 4 }
]}

[languages.zh-tw]
label = "繁體中文"
title = 'BSD之旅'
weight = 2
taxonomies = { category = "categories", tag = "tags", series = "series" }
menu = { main = [
    { name = "關於", url = "about/", weight = 1 },
    { name = "帖子", url = "posts/", weight = 2 },
    { name = "檔案", url = "archives/", weight = 3 },
    { name = "搜尋", url = "search/", weight = 3 },
    { name = "標簽", url = "tags/", weight = 4 }
]}

[outputs]
home = ["HTML", "RSS", "JSON"]

# --- Output Formats ---
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true


# --- Global Params ---
[params]
env = "production" # to enable google analytics, opengraph, twitter-cards and schema.
description = "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
author = "bruce95a"

defaultTheme = "auto"
# disableThemeToggle = true
ShowShareButtons = false
ShowReadingTime = true
# disableSpecial1stPost = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = false
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
comments = false
images = ["images/papermod-cover.png"]

[params.homeInfoParams]
Title = "Hi there 👏"
# Multi-line string for content
Content = """Welcome to my blog. A place to record stuff about FreeBSD."""

# zh
[languages.zh.params.homeInfoParams]
Title = "你好 👏"
# Multi-line string for content
Content = """欢迎来到我的博客。一个用来记录 FreeBSD 相关内容的地方。"""

# zh-tw
[languages.zh-tw.params.homeInfoParams]
Title = "你好 👏"
# Multi-line string for content
Content = """歡迎來到我的部落格。一個用來記錄 FreeBSD 相關內容的場所。"""


# --- Markup Settings ---
[markup.goldmark]
renderer.unsafe = true

[markup.highlight]
noClasses = false
# anchorLineNos = true
# codeFences = true
# guessSyntax = true
# lineNos = true
# style = "monokai"

# --- Services ---
[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true
